<html lang="en">
<head>
<meta charset="utf-8">

<title>The Hundred-Foot Journey: Film Activities</title>
<style>
:root{--bg:#fff8f0;--card:#ffffff;--tx:#2b2118;--mu:#5a4a3c;--ac:#9c3d12;--on:#ffffff;--bd:#d9c3ae;--ok:#14532d;--okb:#dcfce7;--no:#7f1d1d;--nob:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1612;--card:#2a201a;--tx:#f5ebe0;--mu:#d9c8b8;--ac:#f0a36b;--on:#1d1612;--bd:#5c4838;--ok:#bbf7d0;--okb:#14391f;--no:#fecaca;--nob:#4a1a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 Georgia,"Times New Roman",serif}
main,header,footer{max-width:760px;margin:0 auto;padding:16px}
h1,h2{line-height:1.25}h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.4rem}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:20px;margin:14px 0}
button,select{font:inherit;min-height:44px;border-radius:10px}
button{background:var(--ac);color:var(--on);border:2px solid var(--ac);padding:8px 18px;cursor:pointer;margin:6px 8px 6px 0}
button.alt{background:transparent;color:var(--ac)}
button:disabled{opacity:.5;cursor:not-allowed}
select{background:var(--card);color:var(--tx);border:2px solid var(--bd);padding:6px;max-width:100%}
:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
fieldset{border:0;padding:0;margin:0 0 14px}legend{font-weight:bold;margin-bottom:6px}
.opt{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0}
.opt input{width:20px;height:20px;margin-right:8px;vertical-align:middle}
.row{margin:12px 0;padding-bottom:10px;border-bottom:1px dashed var(--bd)}
.fb{margin-top:6px;padding:8px 10px;border-radius:8px;font-size:.95rem}
.ok{background:var(--okb);color:var(--ok)}.no{background:var(--nob);color:var(--no)}
progress{width:100%;height:14px;accent-color:var(--ac)}
.mu{color:var(--mu)}.big{font-size:2.4rem;font-weight:bold;color:var(--ac)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:9}
</style>
</head>

A2:[
{t:"Story facts",ty:"radio",ins:S[0],items:[
{q:"Where does the Kadam family come from?",o:["Italy","Norway","India"],a:2,w:"Yes. The family starts in India and later moves to Europe."},
{q:"What happens to the family’s van in France?",o:["The brakes stop working","It is stolen","It is kidnapped"],a:0,w:"Right. The brake problem is why the family stops in a small French town."},

{t:"Who is who?",ty:"select",ins:"Choose the right description for each person.",opts:["Pick one…","A young cook with a special talent","The father who opens a new restaurant","The owner of the French restaurant","A young chef who helps Hassan"],items:[

{t:"What would you do?",ty:"radio",ins:"Read each imagined situation inspired by the film. Choose the most constructive response. Each situation has one best answer. After you check, read the feedback and think about why it works.",items:[
{q:"Situation 1: You own the French restaurant, and a new neighbour opens across the road. What do you do?",o:["Complain loudly and try to force them to close.","Copy their menu and lower your prices.","Pretend they do not exist.","Visit them, learn about their food, and compete fairly."],a:3,w:"Best choice. Curiosity and fair competition build respect, which is a central lesson of the film. The other options increase conflict or avoid the problem."},
{q:"Situation 2: You are Hassan. A famous kitchen in Paris offers you a place, but your family has built a new life here. What do you do?",o:["Talk honestly with your family and decide on a plan together.","Leave in secret so nobody can stop you.","Refuse the offer without thinking about it.","Let a stranger decide for you."],a:0,w:"Best choice. Honest talk respects both your ambition and the people who matter to you. The other options hide the truth or avoid the decision."},
{q:"Situation 3: You are Papa Kadam. Someone treats your family’s restaurant unfairly because of your culture. What is the most constructive response?",o:["Answer with anger and shout in the street.","Close the restaurant and hide at home.","Stay calm, ask for help from others, and keep showing who you are.","Say nothing and hope it stops."],a:2,w:"Best choice. Staying calm and seeking support protects you, and keeps your dignity. Anger can make the conflict bigger, and silence or hiding can let prejudice continue."},
{q:"Situation 4: You are a young chef. Your mentor says your new ideas break the rules of classical cooking. What do you do?",o:["Ignore all advice and do only what you like.","Learn the classical technique well, then add your own ideas with care.","Stop cooking because you feel criticised.","Copy your mentor exactly and never try anything new."],a:1,w:"Best choice. Respecting tradition while creating something new is a main idea in the film. The other options reject learning or reject your own voice."}]}]

function go(l){lv=l;ai=0;sc=[];done=false;show()}
function show(){
var L=DATA[lv],a=L[ai],p=ai+1,html='<progress value="'+ai+'" max="'+L.length+'" aria-label="Progress"></progress><p class="mu">Level '+lv+' · Activity '+p+' of '+L.length+' · about 4 minutes</p><div class="card"><h2 id="ttl" tabindex="-1">'+h(a.t)+'</h2><p>'+h(a.ins)+'</p><form id="f" onsubmit="return false">';
a.items.forEach(function(it,i){
if(a.ty==="radio"){html+='<fieldset class="row"><legend>'+h(it.q)+'</legend>'+it.o.map(function(o,j){return '<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'">'+h(o)+'</label>'}).join("")+'<div id="r'+i+'"></div></fieldset>'}
else{html+='<div class="row"><label for="q'+i+'">'+h(it.q)+'</label><br><select id="q'+i+'">'+a.opts.map(function(o,j){return '<option value="'+(j?j:"")+'">'+h(o)+'</option>'}).join("")+'</select><div id="r'+i+'"></div></div>'}});
html+='</form><button id="chk">Check answers</button><button id="nxt" class="alt" disabled>'+(ai<L.length-1?"Next activity":"See my score")+'</button><div id="sum" role="status"></div></div><button class="alt" id="rs">Restart</button>';
app.innerHTML=html;document.getElementById("ttl").focus();
document.getElementById("rs").onclick=start;
document.getElementById("chk").onclick=function(){check(a)};
document.getElementById("nxt").onclick=function(){ai++;ai<L.length?show():finish()}}
function check(a){var n=0,empty=0;
a.items.forEach(function(it,i){var v,r=document.getElementById("r"+i);
if(a.ty==="radio"){var c=document.querySelector('input[name="q'+i+'"]:checked');v=c?+c.value:""}else v=document.getElementById("q"+i).value;
if(v===""){empty++;r.innerHTML='<div class="fb no">No answer chosen yet. You can choose one and check again, or move on.</div>';return}
if(+v===it.a){n++;r.innerHTML='<div class="fb ok">✓ Correct! '+h(it.w)+'</div>'}
else r.innerHTML='<div class="fb no">✗ Not yet. Think again and change your answer, then check again.</div>'});
sc[ai]={n:n,m:a.items.length};
